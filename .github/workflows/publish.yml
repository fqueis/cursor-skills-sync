name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm run package

      - name: Publish to VS Marketplace
        run: pnpm exec vsce publish -p ${{ secrets.VSCE_PAT }} --no-dependencies --packagePath "$(ls builds/*.vsix | head -n 1)"

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish "$(ls builds/*.vsix | head -n 1)" -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="$(ls builds/*.vsix | head -n 1)"
          gh release create "${{ github.ref_name }}" "$VSIX" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            --verify-tag
