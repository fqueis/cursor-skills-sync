name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm run package

      - name: Publish to VS Marketplace
        run: pnpm exec vsce publish -p ${{ secrets.VSCE_PAT }} --no-dependencies --packagePath "$(ls builds/*.vsix | head -n 1)"

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish "$(ls builds/*.vsix | head -n 1)" -p ${{ secrets.OVSX_PAT }}
